# HTTP-Image-Server v2.6 — nginx reverse proxy + cache (หน้า app uvicorn)
# เป้าหมาย: cache hit ตอบจาก RAM (tmpfs) โดยไม่แตะ app และ SMB share เลย

worker_processes auto;
worker_rlimit_nofile 100000;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    access_log off;                       # ปิด access log เพื่อ throughput สูงสุด (เปิดได้ถ้าต้องการ audit)
    sendfile on;                          # ส่งไฟล์/cache ด้วย zero-copy
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    keepalive_requests 100000;
    types_hash_max_size 4096;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ---- cache บน tmpfs (RAM) — รูป immutable จึงเก็บได้ยาว ----
    # keys_zone=10m เก็บได้ ~80k key; max_size ปรับตามขนาด tmpfs ใน compose
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=imgcache:50m
                     max_size=3500m inactive=7d use_temp_path=off;

    # ---- upstream ไป app (uvicorn) แบบ keepalive ----
    upstream image_app {
        server app:8080;
        keepalive 256;                    # คง connection ไป backend ไว้ reuse (เลี่ยง handshake)
        keepalive_requests 100000;
    }

    server {
        listen 80 default_server backlog=4096 reuseport;
        server_name _;

        location /image/ {
            proxy_pass http://image_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";          # เปิด keepalive ไป upstream
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_cache imgcache;
            proxy_cache_key "$uri";                  # รูป immutable -> key = path ล้วน
            proxy_cache_valid 200 365d;              # เก็บไฟล์ที่เจอยาว 1 ปี
            proxy_cache_valid 404 10s;               # ไม่เจอ cache สั้น ๆ กันยิงซ้ำถี่
            proxy_cache_lock on;                     # cold cache: ให้คำขอแรกไป app, ที่เหลือรอ cache
            proxy_cache_lock_timeout 5s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            add_header X-Cache-Status $upstream_cache_status;   # ดีบัก: HIT/MISS/LOCK
        }

        location / {
            proxy_pass http://image_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
