# HTTP-Image-Server — nginx reverse proxy for the Windows multi-instance cluster
# Load-balances across 8 single-process instances on 127.0.0.1:8080..8087
# (started by start-cluster.bat) so the box uses multiple CPU cores —
# Windows cannot share one listening socket across processes (WinError 87),
# so one nginx in front of N independent instances is the way.
#
# Usage (nginx for Windows, http://nginx.org/en/download.html):
#   1) Extract nginx to e.g. C:\nginx
#   2) Copy this file to C:\nginx\conf\nginx.conf  (or run: nginx -c <path>)
#   3) start-cluster.bat   (launch the 8 app instances)
#   4) cd C:\nginx ^&^& start nginx      (start:  nginx   / reload: nginx -s reload / stop: nginx -s stop)
#   5) Browse http://localhost:50000/image/...
#
# NOTE: nginx on Windows is functional but NOT high-throughput (it uses the
# select() event model, ~1024 connections per worker). For very high RPS,
# prefer the Linux/Docker deployment. This config is fine for moderate
# internal loads.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    access_log off;                       # turn on if you need an audit trail
    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 30;
    keepalive_requests 100000;
    types_hash_max_size 4096;
    include mime.types;                   # relative to nginx conf dir on Windows
    default_type application/octet-stream;

    # ---- cache (Windows has no tmpfs; point this at an SSD or a RAM disk for speed) ----
    # keys_zone=50m holds ~400k keys; raise max_size to fit your image set.
    proxy_cache_path temp/imgcache levels=1:2 keys_zone=imgcache:50m
                     max_size=3500m inactive=7d use_temp_path=off;

    # ---- the 8 app instances (keepalive to avoid re-handshaking) ----
    upstream image_app {
        least_conn;                       # send each request to the least-busy instance
        server 127.0.0.1:8080;
        server 127.0.0.1:8081;
        server 127.0.0.1:8082;
        server 127.0.0.1:8083;
        server 127.0.0.1:8084;
        server 127.0.0.1:8085;
        server 127.0.0.1:8086;
        server 127.0.0.1:8087;
        keepalive 256;
        keepalive_requests 100000;
    }

    server {
        listen 50000 default_server backlog=4096;   # no reuseport: not supported on Windows
        server_name _;

        location /image/ {
            proxy_pass http://image_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";          # enable keepalive to upstream
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_cache imgcache;
            proxy_cache_key "$uri";                  # images are immutable -> key = path only
            proxy_cache_valid 200 365d;
            proxy_cache_valid 404 10s;
            proxy_cache_lock on;                     # cold cache: first request fills, others wait
            proxy_cache_lock_timeout 5s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            add_header X-Cache-Status $upstream_cache_status;   # debug: HIT/MISS/LOCK
        }

        location / {
            proxy_pass http://image_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
